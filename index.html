<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMART Engineering Assistant | م. خولة</title>
    
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>

    <style>
        :root { 
            --primary: #4338ca; --secondary: #059669; --bg: #f1f5f9; 
            --card-bg: #ffffff; --text: #0f172a; --accent: #6366f1;
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: var(--bg); color: var(--text); 
            margin: 0; padding: 10px; transition: 0.3s; 
        }

        .app-container { 
            max-width: 550px; margin: auto; 
            background: var(--card-bg); border-radius: 2rem; 
            padding: 1.5rem; box-shadow: 0 15px 40px rgba(0,0,0,0.1); 
        }

        /* شريط التحديث العلوي */
        .header-tools {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #eee;
        }

        .refresh-btn {
            background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 10px;
            padding: 8px 15px; cursor: pointer; font-weight: bold; font-size: 0.85rem;
            color: var(--primary); display: flex; align-items: center; gap: 5px;
        }

        /* التبويبات */
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .tab-btn { 
            padding: 8px 15px; cursor: pointer; border: none; background: none; 
            font-weight: bold; opacity: 0.4; font-size: 1rem; border-radius: 10px;
        }
        .tab-btn.active { opacity: 1; background: #eef2ff; color: var(--primary); }

        /* التحكم في الخط */
        .font-controls {
            display: flex; justify-content: center; align-items: center;
            gap: 12px; margin-bottom: 10px; background: #f8fafc;
            padding: 6px; border-radius: 10px;
        }
        .font-btn { 
            width: 32px; height: 32px; border-radius: 50%; border: 1px solid #ccc;
            background: white; cursor: pointer; font-weight: bold;
        }

        /* الأزرار والمربعات */
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        button { 
            padding: 12px; border-radius: 14px; border: 1px solid #e2e8f0; 
            background: #fff; cursor: pointer; font-weight: 600; font-size: 0.9rem;
        }
        .btn-main { background: var(--primary); color: white; border: none; }
        .btn-success { background: var(--secondary); color: white; border: none; }
        .btn-danger { background: #fff1f2; color: #e11d48; border: none; }
        
        textarea { 
            width: 100%; height: 200px; border-radius: 15px; 
            border: 2px solid #f1f5f9; padding: 15px; font-size: 16px;
            resize: none; box-sizing: border-box; background: #fafafa;
        }

        .calc-display { width: 100%; padding: 15px; font-size: 1.6rem; text-align: left; background: #f1f5f9; border-radius: 12px; margin-bottom: 10px; border: none; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .calc-btn { padding: 15px; font-size: 1.2rem; border-radius: 12px; border: 1px solid #eee; background: white; }

        @media print {
            body * { visibility: hidden; }
            #printArea { visibility: visible; position: absolute; left: 0; top: 0; width: 100%; padding: 20px; display: block !important; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header-tools">
        <span style="font-weight: bold; color: var(--primary);">SMART Assistant</span>
        <button class="refresh-btn" onclick="location.reload()">🔄 تحديث التطبيق</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('main', this)">الرئيسية</button>
        <button class="tab-btn" onclick="openTab('eng', this)">هندسي</button>
        <button class="tab-btn" onclick="openTab('adv', this)">متقدم</button>
    </div>

    <div id="status" style="text-align:center; font-size:0.8rem; margin-bottom:10px; color:var(--primary);">جاهز للعمل..</div>

    <div id="main" class="tab-content">
        <div class="font-controls">
            <span>حجم الخط:</span>
            <button class="font-btn" onclick="changeFontSize('txtMain', -2)">-</button>
            <button class="font-btn" onclick="changeFontSize('txtMain', 2)">+</button>
        </div>
        <div class="grid-menu">
            <button class="btn-main" onclick="handleSpeak('txtMain')">🔊 قراءة</button>
            <button class="btn-main" onclick="handleDictation('txtMain')">🎤 إملاء</button>
            <button onclick="handleTranslate()">🌐 ترجمة</button>
            <button class="btn-danger" onclick="clearText('txtMain')">🗑️ مسح</button>
        </div>
        <textarea id="txtMain" placeholder="اكتبي هنا..."></textarea>
    </div>

    <div id="eng" class="tab-content" style="display:none;">
        <input type="text" id="calcDisplay" class="calc-display" readonly placeholder="0">
        <div class="calc-grid">
            <button class="calc-btn" style="color:red" onclick="calcAction('C')">C</button>
            <button class="calc-btn" onclick="calcAction('(')">(</button>
            <button class="calc-btn" onclick="calcAction(')')">)</button>
            <button class="calc-btn" onclick="calcAction('/')">÷</button>
            <button class="calc-btn" onclick="calcAction('7')">7</button>
            <button class="calc-btn" onclick="calcAction('8')">8</button>
            <button class="calc-btn" onclick="calcAction('9')">9</button>
            <button class="calc-btn" onclick="calcAction('*')">×</button>
            <button class="calc-btn" onclick="calcAction('4')">4</button>
            <button class="calc-btn" onclick="calcAction('5')">5</button>
            <button class="calc-btn" onclick="calcAction('6')">6</button>
            <button class="calc-btn" onclick="calcAction('-')">-</button>
            <button class="calc-btn" onclick="calcAction('1')">1</button>
            <button class="calc-btn" onclick="calcAction('2')">2</button>
            <button class="calc-btn" onclick="calcAction('3')">3</button>
            <button class="calc-btn" onclick="calcAction('+')">+</button>
            <button class="calc-btn" onclick="calcAction('0')">0</button>
            <button class="calc-btn" onclick="calcAction('.')">.</button>
            <button class="calc-btn btn-success" style="grid-column: span 2;" onclick="calcAction('=')">=</button>
        </div>
    </div>

    <div id="adv" class="tab-content" style="display:none;">
        <div class="grid-menu">
            <button class="btn-main" onclick="document.getElementById('imgInput').click()" style="grid-column: span 2;">📷 نص من صورة</button>
            <button class="btn-success" onclick="cleanText()">🧹 تنظيف</button>
            <button onclick="copyToClipboard()">📋 نسخ</button>
            <button class="btn-main" onclick="printText()" style="grid-column: span 2; background:#000;">📄 طباعة PDF</button>
        </div>
        <input type="file" id="imgInput" hidden accept="image/*" onchange="extractText(this)">
        <textarea id="txtAdv" style="height: 250px;" placeholder="المعاينة والتعديل..."></textarea>
    </div>

    <p style="text-align:center; font-size:0.7rem; opacity:0.6; margin-top:15px;">إعداد المهندسة خولة المحجوبي ©</p>
</div>

<div id="printArea"></div>

<script>
    function openTab(tabName, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabName).style.display = 'block';
        btn.classList.add('active');
    }

    function changeFontSize(id, step) {
        const el = document.getElementById(id);
        const currentSize = parseFloat(window.getComputedStyle(el).fontSize);
        el.style.fontSize = (currentSize + step) + 'px';
    }

    function extractText(input) {
        if(!input.files[0]) return;
        document.getElementById('status').innerText = "⏳ جاري التحليل...";
        Tesseract.recognize(input.files[0], 'ara+eng').then(({ data: { text } }) => {
            document.getElementById('txtAdv').value = text;
            document.getElementById('status').innerText = "✅ تم الاستخراج";
        });
    }

    function calcAction(val) {
        const d = document.getElementById('calcDisplay');
        if (val === 'C') d.value = '';
        else if (val === '=') { try { d.value = eval(d.value.replace(/×/g, '*').replace(/÷/g, '/')); } catch { d.value = 'خطأ'; } }
        else d.value += val;
    }

    function printText() {
        document.getElementById('printArea').innerText = document.getElementById('txtAdv').value;
        window.print();
    }

    function cleanText() {
        let a = document.getElementById('txtAdv');
        a.value = a.value.replace(/[`~|\\_/*^]/g, '').trim();
    }

    function copyToClipboard() { navigator.clipboard.writeText(document.getElementById('txtAdv').value); }
    function clearText(id) { document.getElementById(id).value = ""; }

    function handleSpeak(id) {
        window.speechSynthesis.cancel();
        let s = new SpeechSynthesisUtterance(document.getElementById(id).value);
        s.lang = 'ar-SA';
        window.speechSynthesis.speak(s);
    }

    function handleDictation(id) {
        const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        rec.lang = 'ar-SA';
        rec.onresult = (e) => { document.getElementById(id).value += e.results[0][0].transcript; };
        rec.start();
    }

    async function handleTranslate() {
        const txt = document.getElementById('txtMain');
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ar&tl=en&dt=t&q=${encodeURIComponent(txt.value)}`;
        const res = await fetch(url);
        const data = await res.json();
        txt.value = data[0][0][0];
    }
</script>
</body>
</html>
