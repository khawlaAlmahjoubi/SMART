<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMART Engineering Assistant | م. خولة</title>
    
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>

    <style>
        :root { 
            --primary: #4338ca; --secondary: #059669; --bg: #f1f5f9; 
            --card-bg: #ffffff; --text: #0f172a; --accent: #6366f1;
        }
        
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; }
        .app-container { max-width: 550px; margin: auto; background: var(--card-bg); border-radius: 2rem; padding: 1.5rem; box-shadow: 0 15px 40px rgba(0,0,0,0.1); }

        /* الهيدر وزر التحديث */
        .header-tools { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .refresh-btn { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 10px; padding: 8px 15px; cursor: pointer; color: var(--primary); font-weight: bold; }

        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 8px 15px; cursor: pointer; border: none; background: none; font-weight: bold; opacity: 0.4; border-radius: 10px; }
        .tab-btn.active { opacity: 1; background: #eef2ff; color: var(--primary); }

        .font-controls { display: flex; justify-content: center; gap: 12px; margin-bottom: 10px; background: #f8fafc; padding: 8px; border-radius: 10px; }
        .font-btn { width: 35px; height: 35px; border-radius: 50%; border: 1px solid #ccc; background: white; cursor: pointer; }

        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        button { padding: 12px; border-radius: 14px; border: 1px solid #e2e8f0; font-weight: 600; cursor: pointer; }
        .btn-main { background: var(--primary); color: white; border: none; }
        .btn-success { background: var(--secondary); color: white; border: none; }
        
        textarea { width: 100%; height: 200px; border-radius: 15px; border: 2px solid #f1f5f9; padding: 15px; font-size: 16px; box-sizing: border-box; }

        /* المحول الهندسي */
        .tool-box { background: #f8fafc; padding: 15px; border-radius: 15px; border: 1px solid #e2e8f0; margin-top: 15px; }
        input[type="number"], select { width: 100%; padding: 12px; margin: 5px 0; border-radius: 10px; border: 1px solid #ddd; }

        .calc-display { width: 100%; padding: 15px; font-size: 1.6rem; text-align: left; background: #f1f5f9; border-radius: 12px; border: none; margin-bottom: 10px; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .calc-btn { padding: 15px; border-radius: 12px; border: 1px solid #eee; background: white; font-weight: bold; }

        @media print { body * { visibility: hidden; } #printArea { visibility: visible; position: absolute; left: 0; top: 0; width: 100%; display: block !important; } }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header-tools">
        <span style="font-weight: bold; color: var(--primary);">SMART Engineering</span>
        <button class="refresh-btn" onclick="location.reload()">🔄 تحديث</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('main', this)">الرئيسية</button>
        <button class="tab-btn" onclick="openTab('eng', this)">هندسي</button>
        <button class="tab-btn" onclick="openTab('adv', this)">متقدم</button>
    </div>

    <div id="main" class="tab-content">
        <div class="font-controls">
            <span>حجم الخط:</span>
            <button class="font-btn" onclick="changeFontSize('txtMain', -2)">-</button>
            <button class="font-btn" onclick="changeFontSize('txtMain', 2)">+</button>
        </div>
        <div class="grid-menu">
            <button class="btn-main" onclick="handleSpeak('txtMain')">🔊 قراءة</button>
            <button class="btn-main" onclick="handleDictation('txtMain')">🎤 إملاء</button>
            <button onclick="handleTranslate()">🌐 ترجمة</button>
            <button style="color:red" onclick="clearText('txtMain')">🗑️ مسح</button>
        </div>
        <textarea id="txtMain" placeholder="اكتبي ملاحظاتك هنا..."></textarea>
    </div>

    <div id="eng" class="tab-content" style="display:none;">
        <input type="text" id="calcDisplay" class="calc-display" readonly placeholder="0">
        <div class="calc-grid">
            <button class="calc-btn" style="color:red" onclick="calcAction('C')">C</button>
            <button class="calc-btn" onclick="calcAction('(')">(</button>
            <button class="calc-btn" onclick="calcAction(')')">)</button>
            <button class="calc-btn" onclick="calcAction('/')">÷</button>
            <button class="calc-btn" onclick="calcAction('7')">7</button>
            <button class="calc-btn" onclick="calcAction('8')">8</button>
            <button class="calc-btn" onclick="calcAction('9')">9</button>
            <button class="calc-btn" onclick="calcAction('*')">×</button>
            <button class="calc-btn" onclick="calcAction('4')">4</button>
            <button class="calc-btn" onclick="calcAction('5')">5</button>
            <button class="calc-btn" onclick="calcAction('6')">6</button>
            <button class="calc-btn" onclick="calcAction('-')">-</button>
            <button class="calc-btn" onclick="calcAction('1')">1</button>
            <button class="calc-btn" onclick="calcAction('2')">2</button>
            <button class="calc-btn" onclick="calcAction('3')">3</button>
            <button class="calc-btn" onclick="calcAction('+')">+</button>
            <button class="calc-btn" onclick="calcAction('0')">0</button>
            <button class="calc-btn" onclick="calcAction('.')">.</button>
            <button class="calc-btn btn-success" style="grid-column: span 2;" onclick="calcAction('=')">=</button>
        </div>

        <div class="tool-box">
            <label style="font-weight:bold;">📏 محول الوحدات:</label>
            <input type="number" id="unitVal" value="1" oninput="convertUnits()">
            <select id="unitType" onchange="convertUnits()">
                <option value="m-cm">متر إلى سنتيمتر</option>
                <option value="cm-m">سنتيمتر إلى متر</option>
                <option value="kg-g">كيلوجرام إلى جرام</option>
                <option value="in-cm">بوصة إلى سنتيمتر</option>
            </select>
            <div id="unitResult" style="font-weight:bold; color:var(--primary); margin-top:8px;">النتيجة: 100 سم</div>
        </div>
    </div>

    <div id="adv" class="tab-content" style="display:none;">
        <div class="grid-menu">
            <button class="btn-main" onclick="document.getElementById('imgInput').click()" style="grid-column: span 2;">📷 نص من صورة</button>
            <button class="btn-success" onclick="cleanText()">🧹 تنظيف</button>
            <button onclick="printText()" style="background:#000; color:#fff">📄 طباعة PDF</button>
        </div>
        <input type="file" id="imgInput" hidden accept="image/*" onchange="extractText(this)">
        <textarea id="txtAdv" style="height: 250px; margin-top:10px;" placeholder="المعاينة..."></textarea>
    </div>
</div>

<div id="printArea" style="display:none; padding:20px; white-space:pre-wrap;"></div>

<script>
    function openTab(name, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(name).style.display = 'block';
        btn.classList.add('active');
    }

    function changeFontSize(id, step) {
        const el = document.getElementById(id);
        const size = parseFloat(window.getComputedStyle(el).fontSize);
        el.style.fontSize = (size + step) + 'px';
    }

    function convertUnits() {
        const val = parseFloat(document.getElementById('unitVal').value) || 0;
        const type = document.getElementById('unitType').value;
        let res = "";
        if(type === "m-cm") res = (val * 100) + " سم";
        else if(type === "cm-m") res = (val / 100) + " متر";
        else if(type === "kg-g") res = (val * 1000) + " جرام";
        else if(type === "in-cm") res = (val * 2.54).toFixed(2) + " سم";
        document.getElementById('unitResult').innerText = "النتيجة: " + res;
    }

    function calcAction(val) {
        const d = document.getElementById('calcDisplay');
        if (val === 'C') d.value = '';
        else if (val === '=') { try { d.value = eval(d.value.replace(/×/g, '*').replace(/÷/g, '/')); } catch { d.value = 'خطأ'; } }
        else d.value += val;
    }

    function extractText(input) {
        if(!input.files[0]) return;
        Tesseract.recognize(input.files[0], 'ara+eng').then(({ data: { text } }) => {
            document.getElementById('txtAdv').value = text;
        });
    }

    function printText() {
        document.getElementById('printArea').innerText = document.getElementById('txtAdv').value;
        window.print();
    }

    function cleanText() {
        let a = document.getElementById('txtAdv');
        a.value = a.value.replace(/[`~|\\_/*^]/g, '').trim();
    }

    function clearText(id) { document.getElementById(id).value = ""; }

    function handleSpeak(id) {
        window.speechSynthesis.cancel();
        let s = new SpeechSynthesisUtterance(document.getElementById(id).value);
        s.lang = 'ar-SA';
        window.speechSynthesis.speak(s);
    }

    function handleDictation(id) {
        const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        rec.lang = 'ar-SA';
        rec.onresult = (e) => { document.getElementById(id).value += e.results[0][0].transcript; };
        rec.start();
    }

    async function handleTranslate() {
        const txt = document.getElementById('txtMain');
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ar&tl=en&dt=t&q=${encodeURIComponent(txt.value)}`;
        const res = await fetch(url);
        const data = await res.json();
        txt.value = data[0][0][0];
    }
</script>
</body>
</html>
