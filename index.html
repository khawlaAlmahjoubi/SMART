<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المحرك المتكامل | م. خولة</title>
    
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js"></script>

    <style>
        :root { --p: #2563eb; --bg: #f8fafc; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 12px; }
        .card { max-width: 600px; margin: auto; background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .brand { text-align: center; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .brand h2 { color: var(--p); margin: 0; font-size: 1.2rem; }
        
        textarea { width: 100%; height: 380px; border: 2px solid #e2e8f0; border-radius: 15px; padding: 15px; font-size: 18px; line-height: 1.6; outline: none; box-sizing: border-box; resize: none; background: #fff; }
        
        .status { font-size: 0.85rem; text-align: center; padding: 10px; margin-bottom: 10px; border-radius: 10px; display: none; font-weight: bold; }
        .st-loading { display: block; background: #dbeafe; color: #1e40af; }
        .st-success { display: block; background: #dcfce7; color: #15803d; }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
        .btn { padding: 14px; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; color: white; font-size: 0.9rem; transition: 0.2s; }
        .bg-blue { background: var(--p); }
        .bg-gray { background: #64748b; }
        .btn:active { transform: scale(0.96); }
        
        .toolbar { display: flex; gap: 5px; margin-bottom: 10px; justify-content: center; }
        .t-btn { background: #f1f5f9; border: none; padding: 8px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <div class="brand">
        <h2>Smart Assistant</h2>
        <small style="color:#666; font-weight:bold">م. خولة المحجوبي</small>
    </div>

    <div id="msg" class="status"></div>

    <div class="toolbar">
        <button class="t-btn" onclick="zoom(2)">➕ تكبير</button>
        <button class="t-btn" onclick="zoom(-2)">➖ تصغير</button>
        <button class="t-btn" onclick="copy()">📋 نسخ</button>
        <button class="t-btn" onclick="speak()">🔊 قراءة</button>
    </div>

    <textarea id="box" placeholder="ابدئي هنا..."></textarea>

    <div class="btn-grid">
        <button class="btn bg-blue" onclick="document.getElementById('imgIn').click()">📷 استخراج من صورة</button>
        <button class="btn bg-blue" onclick="megaTranslate()">🌐 ترجمة فورية</button>
        <button class="btn bg-gray" onclick="printDoc()">📄 طباعة</button>
        <button class="btn bg-gray" style="color:#ffb3b3" onclick="cls()">🗑️ مسح</button>
    </div>
    
    <input type="file" id="imgIn" hidden accept="image/*" onchange="runOCR(this)">
</div>

<script>
    const box = document.getElementById('box');
    const msg = document.getElementById('msg');

    function showMsg(text, type='loading') {
        msg.innerText = text;
        msg.className = 'status st-' + type;
        setTimeout(() => msg.className = 'status', 4000);
    }

    // 1. استخراج النص (OCR)
    async function runOCR(input) {
        if (!input.files[0]) return;
        showMsg("⏳ جاري تحليل الصورة واستخراج النص...");
        box.value = "يتم الاستخراج الآن...";

        try {
            const worker = await Tesseract.createWorker();
            await worker.loadLanguage('ara+eng');
            await worker.initialize('ara+eng');
            const { data: { text } } = await worker.recognize(input.files[0]);
            box.value = text.trim();
            showMsg("✅ تم الاستخراج", "success");
            await worker.terminate();
        } catch (e) { showMsg("❌ خطأ في القراءة", "loading"); }
    }

    // 2. الترجمة الاحترافية (الحل الجذري)
    async function megaTranslate() {
        if (!box.value || box.value.startsWith("يتم")) return;
        showMsg("⏳ جاري الترجمة... يرجى الانتظار");
        
        try {
            // تقسيم النص لقطع صغيرة لضمان استلام الرد كاملاً
            const chunks = box.value.match(/[\s\S]{1,1500}/g) || [box.value];
            let finalOutput = "";

            for (let chunk of chunks) {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ar&dt=t&q=${encodeURIComponent(chunk)}`;
                const response = await fetch(url);
                const data = await response.json();
                
                // التأكد من تجميع كل أجزاء المصفوفة المترجمة
                if (data && data[0]) {
                    data[0].forEach(part => {
                        if (part[0]) finalOutput += part[0];
                    });
                }
            }

            if (finalOutput) {
                box.value = finalOutput;
                showMsg("✅ تمت الترجمة بنجاح", "success");
            } else {
                throw new Error("Empty Result");
            }

        } catch (e) {
            console.error(e);
            showMsg("❌ فشل ظهور الترجمة.. تأكدي من الإنترنت", "loading");
        }
    }

    function zoom(n) {
        let s = parseFloat(window.getComputedStyle(box).fontSize);
        box.style.fontSize = (s + n) + 'px';
    }

    function copy() {
        box.select();
        document.execCommand('copy');
        showMsg("📋 تم النسخ", "success");
    }

    function speak() {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(box.value);
        m.lang = 'ar-SA';
        window.speechSynthesis.speak(m);
    }

    function printDoc() {
        const w = window.open();
        w.document.write(`<body dir="rtl" style="padding:30px;"><h2>م. خولة</h2><hr><p style="font-size:20px;">${box.value}</p></body>`);
        w.print();
    }

    function cls() { if(confirm("مسح؟")) box.value = ""; }

    // حفظ تلقائي
    setInterval(() => localStorage.setItem('kh_db', box.value), 2000);
    window.onload = () => box.value = localStorage.getItem('kh_db') || "";
</script>

</body>
</html>
