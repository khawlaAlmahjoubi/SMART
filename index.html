<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Assistant | م. خولة</title>
    
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        :root { --main: #2563eb; --bg: #f8fafc; }
        body { font-family: system-ui, sans-serif; background: var(--bg); margin: 0; padding: 10px; padding-bottom: 80px; }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .brand { text-align: center; margin-bottom: 15px; }
        .brand h2 { color: var(--main); margin: 0; font-size: 1.2rem; }
        
        textarea { width: 100%; height: 200px; border: 2px solid #e2e8f0; border-radius: 12px; padding: 12px; font-size: 16px; box-sizing: border-box; outline: none; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        button { padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .btn-p { background: var(--main); color: white; }
        .btn-s { background: #f1f5f9; color: #1e293b; }

        #status { text-align: center; font-size: 0.85rem; font-weight: bold; margin: 10px 0; padding: 8px; border-radius: 8px; display: none; }
        .active-st { display: block !important; background: #dbeafe; color: #1e40af; }

        .nav { position: fixed; bottom: 10px; left: 10px; right: 10px; background: white; display: flex; padding: 5px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .nav-btn { flex: 1; padding: 12px; border: none; background: none; font-weight: bold; color: #64748b; border-radius: 10px; }
        .nav-btn.active { background: var(--main); color: white; }
    </style>
</head>
<body>

<div class="brand">
    <h2>Smart Assistant</h2>
    <small>عمل المهندسة: خولة المحجوبي</small>
</div>

<div id="status"></div>

<div id="ocr-sec" class="sec">
    <div class="card">
        <button class="btn-p" style="width: 100%" onclick="document.getElementById('imgIn').click()">📷 تصوير أو رفع صورة</button>
        <input type="file" id="imgIn" hidden accept="image/*" onchange="processOCR(this)">
        <textarea id="ocrRes" placeholder="النص المستخرج سيظهر هنا.."></textarea>
        <div class="grid">
            <button class="btn-s" onclick="copy('ocrRes')">📋 نسخ</button>
            <button class="btn-s" onclick="printText('ocrRes')">📄 طباعة</button>
        </div>
    </div>
</div>

<div id="note-sec" class="sec" style="display:none">
    <div class="card">
        <textarea id="noteTxt" placeholder="اكتبي ملاحظاتك هنا.."></textarea>
        <div class="grid">
            <button class="btn-p" onclick="translateNote()">🌐 ترجمة للعربية</button>
            <button class="btn-s" onclick="printText('noteTxt')">📄 طباعة</button>
        </div>
    </div>
</div>

<div class="nav">
    <button class="nav-btn active" onclick="tab('ocr-sec', this)">صور</button>
    <button class="nav-btn" onclick="tab('note-sec', this)">مفكرة</button>
</div>

<script>
    function tab(id, btn) {
        document.querySelectorAll('.sec').forEach(s => s.style.display = 'none');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).style.display = 'block';
        btn.classList.add('active');
    }

    // حل مشكلة القراءة (OCR)
    async function processOCR(input) {
        if (!input.files[0]) return;
        const st = document.getElementById('status');
        const res = document.getElementById('ocrRes');
        st.innerText = "⏳ جاري تشغيل المحرك.. انتظر ثواني";
        st.className = "active-st";
        res.value = "";

        try {
            const worker = await Tesseract.createWorker('ara+eng');
            const ret = await worker.recognize(input.files[0]);
            if (ret.data.text.trim() === "") throw new Error();
            res.value = ret.data.text;
            st.innerText = "✅ تمت القراءة بنجاح";
            await worker.terminate();
        } catch (e) {
            st.innerText = "⚠️ لم أستطع قراءة النص. تأكدي من وضوح الصورة.";
            res.value = "خطأ في القراءة: يرجى إعادة التصوير بإضاءة أفضل.";
        }
    }

    // حل مشكلة الترجمة (المضمون)
    async function translateNote() {
        const txt = document.getElementById('noteTxt');
        if (!txt.value) return;
        const st = document.getElementById('status');
        st.innerText = "⏳ جاري الترجمة...";
        st.className = "active-st";

        try {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ar&dt=t&q=${encodeURIComponent(txt.value)}`;
            const response = await fetch(url);
            const data = await response.json();
            txt.value = data[0].map(x => x[0]).join(''); // تجميع كل مقاطع الترجمة
            st.innerText = "✅ تمت الترجمة";
        } catch (e) {
            st.innerText = "❌ فشل الاتصال بالسيرفر";
        }
    }

    // حل مشكلة الطباعة (طريقة النافذة المنبثقة)
    function printText(id) {
        const content = document.getElementById(id).value;
        if (!content) return alert("لا يوجد نص لطباعته");
        
        const win = window.open('', '_blank');
        win.document.write(`
            <html dir="rtl">
            <head><title>طباعة - م. خولة المحجوبي</title></head>
            <body style="font-family:Arial; padding:20px;">
                <h2 style="border-bottom:2px solid #000;">Smart Assistant - تقرير نصي</h2>
                <p style="white-space: pre-wrap;">${content}</p>
                <script>window.print(); window.close();<\/script>
            </body>
            </html>
        `);
        win.document.close();
    }

    function copy(id) {
        const t = document.getElementById(id);
        t.select();
        document.execCommand('copy');
        alert("تم النسخ ✅");
    }
</script>

</body>
</html>
