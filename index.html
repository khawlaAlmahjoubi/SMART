<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4f46e5">
    <link rel="manifest" href="manifest.json"> <title>SMART Assistant v2.0</title>
    
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

    <style>
        :root { --p: #4f46e5; --bg: #f8fafc; }
        body { font-family: system-ui, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .app-card { max-width: 500px; margin: auto; background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        
        /* شريط الحالة والتحميل */
        #status { font-size: 0.8rem; color: var(--p); text-align: center; margin-bottom: 10px; font-weight: bold; }
        .progress-bar { height: 4px; background: #eee; border-radius: 2px; overflow: hidden; display: none; }
        #progress { height: 100%; background: var(--p); width: 0%; transition: 0.3s; }

        .tabs { display: flex; gap: 5px; background: #f1f5f9; padding: 5px; border-radius: 12px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; border: none; background: none; cursor: pointer; border-radius: 8px; font-weight: bold; color: #64748b; }
        .tab.active { background: white; color: var(--p); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

        textarea { width: 100%; height: 200px; border: 2px solid #f1f5f9; border-radius: 12px; padding: 12px; font-size: 16px; box-sizing: border-box; outline: none; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        button { padding: 12px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; background: var(--p); color: white; }
        button.sec { background: #e2e8f0; color: #1e293b; }

        /* معاينة الصورة لضمان عدم ظهورها فارغة */
        #imgPreview { width: 100%; max-height: 200px; object-fit: contain; margin-top: 10px; display: none; border-radius: 10px; border: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="app-card">
    <div id="status">جاهز للعمل بدون إنترنت ✅</div>
    <div class="progress-bar" id="pBar"><div id="progress"></div></div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('main', this)">الرئيسية</button>
        <button class="tab" onclick="switchTab('ocr', this)">OCR</button>
        <button class="tab" onclick="switchTab('about', this)">حول</button>
    </div>

    <div id="main" class="tab-content">
        <textarea id="txtMain" placeholder="اكتبي هنا.. سيتم الحفظ تلقائياً"></textarea>
        <div class="grid">
            <button onclick="playAudio('txtMain')">🔊 تشغيل الصوت</button>
            <button onclick="startDictation('txtMain')">🎤 إملاء صوتي</button>
        </div>
    </div>

    <div id="ocr" class="tab-content" style="display:none">
        <input type="file" id="fileIn" accept="image/*" hidden onchange="processOCR(this)">
        <button style="width:100%" onclick="document.getElementById('fileIn').click()">📷 التقط صورة أو اختر ملف</button>
        <img id="imgPreview">
        <textarea id="txtOCR" style="margin-top:10px" placeholder="النص المستخلص سيظهر هنا.."></textarea>
    </div>

    <div id="about" class="tab-content" style="display:none">
        <h3>حول المنصة</h3>
        <p>هذا التطبيق مصمم لخدمة المهندسين ميدانياً. يعمل بتقنية PWA لضمان العمل بدون إنترنت.</p>
        <ul style="font-size: 0.9rem; line-height: 1.6;">
            <li><b>الصوت:</b> إذا لم يعمل، تأكدي من تفعيل "صوت الوسائط" في هاتفك.</li>
            <li><b>OCR:</b> التقطي صوراً في إضاءة جيدة لنتائج أفضل.</li>
            <li><b>الحفظ:</b> يتم حفظ نصوصك محلياً في المتصفح.</li>
        </ul>
    </div>
</div>

<script>
    // 1. حل مشكلة الصوت على أندرويد (AudioContext Unlock)
    let audioContext;
    function initAudio() {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playAudio(id) {
        initAudio(); // فتح القفل عند أول نقرة
        const text = document.getElementById(id).value;
        if (!text) return;
        
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ar-SA';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    }

    // 2. حل مشكلة OCR (المعاينة الفارغة والنتائج)
    async function processOCR(input) {
        if (!input.files[0]) return;
        
        const file = input.files[0];
        const preview = document.getElementById('imgPreview');
        const status = document.getElementById('status');
        const pBar = document.getElementById('pBar');
        const progress = document.getElementById('progress');

        // إظهار المعاينة فوراً
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
        
        status.innerText = "⏳ جاري تحميل محرك النصوص...";
        pBar.style.display = 'block';

        try {
            // استخدام نسخة Tesseract التي تدعم العمل الـ Offline
            const worker = await Tesseract.createWorker({
                logger: m => {
                    if (m.status === 'recognizing text') {
                        progress.style.width = (m.progress * 100) + '%';
                        status.innerText = `جاري استخراج النص... ${Math.round(m.progress * 100)}%`;
                    }
                }
            });

            await worker.loadLanguage('ara+eng');
            await worker.initialize('ara+eng');
            const { data: { text } } = await worker.recognize(file);
            
            document.getElementById('txtOCR').value = text;
            status.innerText = "✅ تم الاستخراج بنجاح";
            await worker.terminate();
        } catch (e) {
            status.innerText = "❌ خطأ في المعالجة";
            console.error(e);
        } finally {
            pBar.style.display = 'none';
        }
    }

    // 3. الحفظ التلقائي (localStorage)
    document.getElementById('txtMain').oninput = (e) => localStorage.setItem('saved_txt', e.target.value);
    window.onload = () => {
        if (localStorage.getItem('saved_txt')) document.getElementById('txtMain').value = localStorage.getItem('saved_txt');
        
        // تسجيل الـ Service Worker لضمان بقاء الأيقونة وتثبيت الـ PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => console.log("PWA Ready"));
        }
    };

    function switchTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).style.display = 'block';
        btn.classList.add('active');
    }

    function startDictation(id) {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Speech) return alert("متصفحك لا يدعم الإملاء");
        const rec = new Speech();
        rec.lang = 'ar-SA';
        rec.onstart = () => document.getElementById('status').innerText = "🎤 اسمعك.. تكلمي الآن";
        rec.onresult = (e) => {
            document.getElementById(id).value += e.results[0][0].transcript;
            document.getElementById('status').innerText = "✅ تمت الإضافة";
        };
        rec.start();
    }
</script>
</body>
</html>
