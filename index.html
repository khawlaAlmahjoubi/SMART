<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Assistant | م. خولة</title>
    
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@2.1.1/dist/tesseract.min.js"></script>

    <style>
        :root { --main: #2563eb; --bg: #f8fafc; }
        body { font-family: system-ui, sans-serif; background: var(--bg); margin: 0; padding: 10px; padding-bottom: 80px; }
        .card { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 10px; }
        
        /* الترويسة */
        .brand { text-align: center; color: var(--main); margin-bottom: 10px; }
        .brand h2 { margin: 0; font-size: 1.1rem; }

        /* منطقة النص */
        textarea { width: 100%; height: 280px; border: 2px solid #e2e8f0; border-radius: 12px; padding: 12px; font-size: 16px; outline: none; transition: 0.2s; resize: none; }
        
        /* شريط الأدوات العلوي (تكبير/تصغير/إملاء) */
        .toolbar { display: flex; gap: 5px; margin-bottom: 8px; overflow-x: auto; padding-bottom: 5px; }
        .tool { background: #f1f5f9; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; white-space: nowrap; font-size: 0.8rem; }
        .mic-on { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }

        /* الأزرار الأساسية */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        button.action { padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .btn-p { background: var(--main); color: white; }
        .btn-s { background: #e2e8f0; color: #1e293b; }

        /* حالة التحميل */
        #status { font-size: 0.8rem; text-align: center; font-weight: bold; margin: 5px; display: none; padding: 8px; border-radius: 8px; }
        .loading { display: block !important; background: #dbeafe; color: #1e40af; }
    </style>
</head>
<body>

<div class="brand">
    <h2>Smart Assistant</h2>
    <small>م. خولة المحجوبي - أداء عالي</small>
</div>

<div id="status"></div>

<div class="card">
    <div class="toolbar">
        <button class="tool" onclick="zoom(2)">➕ تكبير</button>
        <button class="tool" onclick="zoom(-2)">➖ تصغير</button>
        <button id="micBtn" class="tool" onclick="startVoice()">🎤 إملاء صوتي</button>
        <button class="tool" onclick="speakText()">🔊 قراءة النص</button>
    </div>

    <textarea id="txt" placeholder="اكتبي هنا، أو استخرجي نص من صورة، أو استخدمي الإملاء الصوتي..."></textarea>

    <div class="grid">
        <button class="action btn-p" onclick="document.getElementById('fileIn').click()">📷 استخراج من صورة</button>
        <button class="action btn-p" onclick="translateNow()">🌐 ترجمة فورية</button>
        <button class="action btn-s" onclick="copyNow()">📋 نسخ</button>
        <button class="action btn-s" onclick="printNow()">📄 طباعة</button>
    </div>
    <input type="file" id="fileIn" hidden accept="image/*" onchange="runFastOCR(this)">
</div>

<button class="action btn-s" style="width:100%; color:red" onclick="if(confirm('مسح؟')) document.getElementById('txt').value=''">🗑️ مسح المذكرة</button>

<script>
    const box = document.getElementById('txt');
    const st = document.getElementById('status');

    // 1. استخراج النص - نسخة سريعة (Fast Mode)
    async function runFastOCR(input) {
        if (!input.files[0]) return;
        st.innerText = "⏳ جاري المعالجة السريعة...";
        st.className = "loading";
        
        try {
            // استخدام Worker مبسط لتقليل وقت التحميل
            const worker = Tesseract.createWorker();
            await worker.load();
            await worker.loadLanguage('ara+eng');
            await worker.initialize('ara+eng');
            const { data: { text } } = await worker.recognize(input.files[0]);
            
            if (text && text.trim().length > 0) {
                box.value += "\n" + text;
                st.innerText = "✅ تمت القراءة";
            } else {
                st.innerText = "⚠️ لم يتم العثور على نص واضح";
            }
            await worker.terminate();
        } catch (e) {
            st.innerText = "❌ خطأ: تأكدي من جودة الصورة";
        }
        setTimeout(() => st.className = "", 3000);
    }

    // 2. الإملاء الصوتي (التعرف على الصوت)
    function startVoice() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Speech) return alert("متصفحك لا يدعم الصوت");
        const rec = new Speech();
        rec.lang = 'ar-SA';
        rec.onstart = () => {
            document.getElementById('micBtn').classList.add('mic-on');
            st.innerText = "🎤 أنا أسمعكِ الآن...";
            st.className = "loading";
        };
        rec.onresult = (e) => {
            box.value += " " + e.results[0][0].transcript;
        };
        rec.onend = () => {
            document.getElementById('micBtn').classList.remove('mic-on');
            st.className = "";
        };
        rec.start();
    }

    // 3. الترجمة الفورية
    async function translateNow() {
        if (!box.value) return;
        st.innerText = "⏳ جاري الترجمة...";
        st.className = "loading";
        try {
            const r = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ar&dt=t&q=${encodeURIComponent(box.value)}`);
            const d = await r.json();
            box.value = d[0].map(x => x[0]).join('');
            st.innerText = "✅ تمت الترجمة";
        } catch (e) { alert("فشل الاتصال"); }
        setTimeout(() => st.className = "", 2000);
    }

    // 4. أدوات القراءة والتحكم بالخط
    function zoom(n) {
        let s = parseFloat(window.getComputedStyle(box).fontSize);
        box.style.fontSize = (s + n) + 'px';
    }

    function speakText() {
        if (!box.value) return;
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(box.value);
        m.lang = 'ar-SA';
        window.speechSynthesis.speak(m);
    }

    // 5. وظائف إضافية
    function copyNow() {
        box.select();
        document.execCommand('copy');
        st.innerText = "📋 تم النسخ";
        st.className = "loading";
        setTimeout(() => st.className = "", 2000);
    }

    function printNow() {
        const w = window.open('', '_blank');
        w.document.write(`<body dir="rtl" style="padding:30px;"><h3>مساعد م. خولة</h3><hr><p style="white-space:pre-wrap; font-size:20px;">${box.value}</p><script>window.print();<\/script></body>`);
        w.document.close();
    }

    // حفظ تلقائي
    setInterval(() => localStorage.setItem('kh_save', box.value), 2000);
    window.onload = () => box.value = localStorage.getItem('kh_save') || "";
</script>

</body>
</html>
