<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Engineers Assistant</title>
    
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@2.1.1/dist/tesseract.min.js"></script>

    <style>
        :root { --p: #2563eb; --bg: #fdfdfd; --dark: #1e293b; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 12px; color: var(--dark); }
        .container { max-width: 450px; margin: auto; }

        /* الأزرار العلوية */
        .tabs { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab { flex: 1; padding: 12px; border: none; border-radius: 12px; background: #f1f5f9; font-weight: bold; color: #64748b; cursor: pointer; transition: 0.3s; }
        .tab.active { background: var(--p); color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }

        /* منطقة العمل */
        .card { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; }
        textarea { width: 100%; height: 180px; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 12px; font-size: 16px; box-sizing: border-box; resize: none; margin-bottom: 10px; }

        /* الأزرار الاحترافية */
        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .btn { padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.9rem; }
        .btn-blue { background: var(--p); color: white; }
        .btn-gray { background: #f1f5f9; color: var(--dark); }

        /* آلة حاسبة بتصميم "آيفون" احترافي */
        .calc { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: #f8fafc; padding: 15px; border-radius: 20px; }
        .calc-screen { grid-column: span 4; background: transparent; text-align: left; font-size: 2rem; padding: 10px; border-bottom: 1px solid #ddd; margin-bottom: 10px; min-height: 50px; overflow: hidden; }
        .c-btn { padding: 18px; border-radius: 50%; border: none; background: white; font-weight: bold; font-size: 1.2rem; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .c-op { background: #fee2e2; color: #ef4444; }
        .c-eq { background: #2563eb; color: white; }

        #status { font-size: 0.75rem; text-align: center; color: var(--p); margin-top: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab active" onclick="sw('main', this)">المذكرة</button>
        <button class="tab" onclick="sw('eng', this)">الحاسبة</button>
        <button class="tab" onclick="sw('ocr', this)">الصور</button>
    </div>

    <div id="main" class="section">
        <div class="card">
            <textarea id="txtMain" placeholder="اكتبي ملاحظاتك هنا..."></textarea>
            <div class="btn-row">
                <button class="btn btn-blue" onclick="startSpeech()">🎤 إملاء (تحدثي)</button>
                <button class="btn btn-blue" onclick="playText()">🔊 استماع</button>
                <button class="btn btn-gray" onclick="translateText()">🌐 ترجمة للعربية</button>
                <button class="btn btn-gray" style="color:red" onclick="cls()">🗑️ مسح</button>
            </div>
            <div id="status">جاهز..</div>
        </div>
    </div>

    <div id="eng" class="section" style="display:none">
        <div class="card">
            <div id="screen" class="calc-screen">0</div>
            <div class="calc">
                <button class="c-btn c-op" onclick="c('C')">AC</button>
                <button class="c-btn c-op" onclick="c('/')">÷</button>
                <button class="c-btn c-op" onclick="c('*')">×</button>
                <button class="c-btn c-op" onclick="c('-')">-</button>
                <button class="c-btn" onclick="c('7')">7</button>
                <button class="c-btn" onclick="c('8')">8</button>
                <button class="c-btn" onclick="c('9')">9</button>
                <button class="c-btn c-op" onclick="c('+')">+</button>
                <button class="c-btn" onclick="c('4')">4</button>
                <button class="c-btn" onclick="c('5')">5</button>
                <button class="c-btn" onclick="c('6')">6</button>
                <button class="c-btn c-eq" onclick="c('=')">=</button>
                <button class="c-btn" onclick="c('1')">1</button>
                <button class="c-btn" onclick="c('2')">2</button>
                <button class="c-btn" onclick="c('3')">3</button>
                <button class="c-btn" onclick="c('0')">0</button>
            </div>
        </div>
    </div>

    <div id="ocr" class="section" style="display:none">
        <div class="card">
            <button class="btn btn-blue" style="width:100%; margin-bottom:10px" onclick="document.getElementById('file').click()">📷 تصوير أو اختيار صورة</button>
            <input type="file" id="file" hidden accept="image/*" onchange="runOCR(this)">
            <textarea id="txtOCR" placeholder="النص سيظهر هنا بعد التحليل..."></textarea>
            <button class="btn btn-gray" style="width:100%" onclick="copyOCR()">📋 نسخ النص</button>
        </div>
    </div>
</div>

<script>
    // التنقل السلس
    function sw(id, btn) {
        document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).style.display = 'block';
        btn.classList.add('active');
    }

    // حل مشكلة الإملاء (Speech to Text)
    function startSpeech() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Speech) return alert("المتصفح لا يدعم الإملاء");
        
        const rec = new Speech();
        rec.lang = 'ar-SA';
        rec.continuous = false;
        
        rec.onstart = () => document.getElementById('status').innerText = "🔴 جاري الاستماع.. تكلمي";
        rec.onresult = (e) => {
            document.getElementById('txtMain').value += " " + e.results[0][0].transcript;
            document.getElementById('status').innerText = "✅ تمت الإضافة";
        };
        rec.onerror = () => document.getElementById('status').innerText = "❌ لم أسمعك جيداً، جربي ثانية";
        rec.start();
    }

    // الترجمة الفورية (بدون تعقيد)
    async function translateText() {
        const txt = document.getElementById('txtMain');
        if(!txt.value) return;
        document.getElementById('status').innerText = "⏳ جاري الترجمة...";
        try {
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ar&dt=t&q=${encodeURIComponent(txt.value)}`);
            const data = await res.json();
            txt.value = data[0][0][0];
            document.getElementById('status').innerText = "✅ تمت الترجمة";
        } catch(e) { document.getElementById('status').innerText = "❌ خطأ في الاتصال"; }
    }

    // الحاسبة
    let exp = "";
    function c(v) {
        const s = document.getElementById('screen');
        if(v==='C') { exp = ""; s.innerText = "0"; }
        else if(v==='=') { try { exp = eval(exp).toString(); s.innerText = exp; } catch { s.innerText = "خطأ"; exp = ""; } }
        else { exp += v; s.innerText = exp; }
    }

    // استخراج النصوص (OCR) - نسخة خفيفة ومباشرة
    async function runOCR(input) {
        if(!input.files[0]) return;
        const status = document.getElementById('status');
        status.innerText = "⏳ جاري تحليل الصورة...";
        try {
            const { data: { text } } = await Tesseract.recognize(input.files[0], 'ara+eng');
            document.getElementById('txtOCR').value = text;
            status.innerText = "✅ تم الاستخراج";
        } catch(e) { status.innerText = "❌ فشل التحليل"; }
    }

    function playText() {
        window.speechSynthesis.cancel();
        let m = new SpeechSynthesisUtterance(document.getElementById('txtMain').value);
        m.lang = 'ar-SA';
        window.speechSynthesis.speak(m);
    }
    function cls() { if(confirm("مسح؟")) document.getElementById('txtMain').value = ""; }
    function copyOCR() { navigator.clipboard.writeText(document.getElementById('txtOCR').value); alert("تم النسخ"); }
</script>
</body>
</html>
