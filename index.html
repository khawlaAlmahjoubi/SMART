<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMART Engineering Assistant | م. خولة</title>
    
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root { 
            --primary: #4f46e5; --secondary: #10b981; --bg: #f8fafc; 
            --card-bg: #ffffff; --text: #1e293b; 
        }
        .dark-mode { --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; transition: 0.3s; }
        
        .app-container { max-width: 500px; margin: auto; background: var(--card-bg); border-radius: 2rem; padding: 1.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }

        /* Tabs */
        .tabs { display: flex; justify-content: space-around; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .tab-btn { padding: 10px; cursor: pointer; border: none; background: none; color: var(--text); font-weight: bold; opacity: 0.6; }
        .tab-btn.active { opacity: 1; border-bottom: 3px solid var(--primary); color: var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Buttons & Inputs */
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        button { padding: 12px; border-radius: 12px; border: none; background: #eee; color: #333; cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-main { background: var(--primary); color: white; }
        textarea { width: 100%; height: 120px; border-radius: 15px; border: 2px solid #eee; padding: 10px; font-size: 1rem; resize: none; box-sizing: border-box; }
        
        /* Tools Styling */
        .tool-box { background: var(--bg); padding: 15px; border-radius: 15px; margin-top: 10px; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: 1px solid #ccc; }
        
        #qrcode { display: flex; justify-content: center; margin-top: 10px; }
        .status { font-size: 0.8rem; color: var(--primary); margin: 10px 0; height: 15px; }
    </style>
</head>
<body>

<div class="app-container">
    <h3 style="text-align:center; color:var(--primary)">المساعد الهندسي SMART</h3>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('main')">الرئيسية</button>
        <button class="tab-btn" onclick="openTab('eng')">هندسي</button>
        <button class="tab-btn" onclick="openTab('adv')">متقدم</button>
    </div>

    <div id="status" class="status">جاهز..</div>

    <div id="main" class="tab-content active">
        <div class="grid-menu">
            <button class="btn-main" onclick="handleSpeak()">🔊 قراءة</button>
            <button class="btn-main" onclick="handleDictation()">🎤 إملاء</button>
            <button onclick="handleTranslate()">🌐 ترجمة (EN)</button>
            <button onclick="handleCopy()">📋 نسخ</button>
        </div>
        <textarea id="txtInput" placeholder="اكتب هنا أو استخدم الأدوات..."></textarea>
    </div>

    <div id="eng" class="tab-content">
        <div class="tool-box">
            <label>🔢 حاسبة سريعة (اكتب معادلة):</label>
            <input type="text" id="calcInput" placeholder="مثلاً: (50*2)/5" oninput="quickCalc()">
            <div id="calcResult" style="font-weight:bold; color:var(--secondary)">النتيجة: 0</div>
        </div>
        <div class="tool-box">
            <label>📏 محول وحدات (طول):</label>
            <input type="number" id="unitVal" value="1" oninput="convertUnits()">
            <select id="unitType" onchange="convertUnits()">
                <option value="m-cm">متر إلى سم</option>
                <option value="in-cm">بوصة إلى سم</option>
                <option value="ft-m">قدم إلى متر</option>
            </select>
            <div id="unitResult" style="font-weight:bold">النتيجة: 100 سم</div>
        </div>
    </div>

    <div id="adv" class="tab-content">
        <div class="grid-menu">
            <button onclick="document.getElementById('imgInput').click()">📷 قراءة صورة</button>
            <button onclick="generatePDF()">📄 تصدير PDF</button>
            <button onclick="generateQR()">🏁 كود QR</button>
            <button onclick="handleClear()" style="background:#fee2e2; color:red">🗑️ مسح الكل</button>
        </div>
        <input type="file" id="imgInput" hidden accept="image/*" onchange="extractText(this)">
        <div id="qrcode"></div>
    </div>

    <div style="text-align:center; margin-top:20px; font-size:0.8rem; opacity:0.7">
        إعداد المهندسة خولة المحجوبي &copy;
    </div>
</div>

<script>
    // Tab System
    function openTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabName).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    const txtInput = document.getElementById('txtInput');
    const status = document.getElementById('status');

    function setStatus(msg) { status.innerText = msg; }

    // --- Main Features ---
    function handleSpeak() {
        const synth = window.speechSynthesis;
        synth.cancel();
        const speech = new SpeechSynthesisUtterance(txtInput.value);
        speech.lang = 'ar-SA';
        synth.speak(speech);
        setStatus("جاري القراءة...");
    }

    function handleDictation() {
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'ar-SA';
        recognition.onstart = () => setStatus("اسمعك... تحدث");
        recognition.onresult = (e) => { txtInput.value += e.results[0][0].transcript; setStatus("تم الإملاء"); };
        recognition.start();
    }

    async function handleTranslate() {
        setStatus("جاري الترجمة...");
        const text = txtInput.value;
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ar|en`);
        const data = await res.json();
        txtInput.value = data.responseData.translatedText;
        setStatus("تمت الترجمة للإنجليزية");
    }

    function handleCopy() {
        navigator.clipboard.writeText(txtInput.value);
        setStatus("تم النسخ للحافظة");
    }

    // --- Engineering Features ---
    function quickCalc() {
        try {
            const res = eval(document.getElementById('calcInput').value);
            document.getElementById('calcResult').innerText = "النتيجة: " + (res || 0);
        } catch { }
    }

    function convertUnits() {
        const val = document.getElementById('unitVal').value;
        const type = document.getElementById('unitType').value;
        let res = 0;
        if(type === "m-cm") res = val * 100 + " سم";
        if(type === "in-cm") res = val * 2.54 + " سم";
        if(type === "ft-m") res = val * 0.3048 + " متر";
        document.getElementById('unitResult').innerText = "النتيجة: " + res;
    }

    // --- Advanced Features ---
    function extractText(input) {
        setStatus("جاري تحليل الصورة (OCR)... انتظر قليلاً");
        Tesseract.recognize(input.files[0], 'ara+eng').then(({ data: { text } }) => {
            txtInput.value += text;
            setStatus("تم استخراج النص من الصورة");
        });
    }

    function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("Report by: Eng. Khawla", 10, 10);
        doc.text(txtInput.value, 10, 20);
        doc.save("Engineer_Report.pdf");
        setStatus("تم تحميل ملف PDF");
    }

    function generateQR() {
        document.getElementById("qrcode").innerHTML = "";
        new QRCode(document.getElementById("qrcode"), txtInput.value);
        setStatus("تم توليد باركود للنص");
    }

    function handleClear() {
        if(confirm("هل تريد مسح كل النص؟")) txtInput.value = "";
    }
</script>
</body>
</html>
