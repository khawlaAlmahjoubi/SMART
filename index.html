<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد الرقمي الشامل | م. خولة المحجوبي</title>
    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; transition: 0.3s; }
        .app-card { background: white; width: 100%; max-width: 500px; padding: 2rem; border-radius: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.1); text-align: center; }
        
        /* تحسين شبكة الأزرار لضمان الاستجابة */
        .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        
        button { 
            padding: 15px; border-radius: 15px; border: 1px solid #eee; background: #fff;
            font-weight: bold; cursor: pointer; transition: 0.2s;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            /* منع أي تداخل يمنع الضغط */
            position: relative; z-index: 10; 
        }

        button:active { transform: scale(0.92); background: #eee; }

        textarea { 
            width: 100%; height: 150px; padding: 15px; border-radius: 15px; 
            border: 2px solid #f1f5f9; font-size: 16px; resize: none; outline: none;
            box-sizing: border-box;
        }

        .footer { margin-top: 25px; color: var(--primary); font-weight: bold; font-size: 1.1rem; }
        .dark-mode { background: #0f172a; }
        .dark-mode .app-card { background: #1e293b; color: white; }
    </style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">
</head>
<body>

<div class="app-card">
    <div class="toolbar">
        <button onclick="handleSpeak()">🔊 إقرأ</button>
        <button onclick="handleStop()">⏹️ إيقاف</button>
        <button onclick="handleDictation()">🎤 املي</button>
        <button onclick="handleDark()">🌓 ليلي</button>
    </div>

    <textarea id="txtInput" placeholder="اكتب نصك هنا..."></textarea>

    <div class="footer">إعداد المهندسة: خولة المحجوبي</div>
</div>

<script>
    const txtInput = document.getElementById('txtInput');
    const synth = window.speechSynthesis;

    // دالة القراءة - أضفت تنبيهاً للتأكد من عمل الزر
    function handleSpeak() {
        if (!txtInput.value) {
            alert("الرجاء كتابة نص أولاً!");
            return;
        }
        // إلغاء أي قراءة سابقة لتجنب التداخل
        synth.cancel();
        const speech = new SpeechSynthesisUtterance(txtInput.value);
        speech.lang = 'ar-SA';
        synth.speak(speech);
    }

    function handleStop() {
        synth.cancel();
    }

    function handleDark() {
        document.body.classList.toggle('dark-mode');
    }

    // دالة الإملاء - تحتاج إنترنت ومتصفح كروم
    function handleDictation() {
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'ar-SA';
        recognition.onresult = (event) => {
            txtInput.value += event.results[0][0].transcript;
        };
        recognition.start();
    }
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('Service Worker Registered'))
        .catch(err => console.log('Error:', err));
    });
  }
</script>
</body>
</html>
