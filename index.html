<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Assistant | م. خولة المحجوبي</title>
    
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--text); padding-bottom: 80px; }
        .container { max-width: 500px; margin: auto; }

        /* الترويسة */
        .brand { text-align: center; padding: 15px; background: white; border-radius: 20px; margin-bottom: 15px; border-bottom: 4px solid var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .brand h2 { margin: 0; color: var(--primary); font-size: 1.2rem; }
        .brand p { margin: 5px 0 0; font-size: 0.8rem; font-weight: bold; color: #64748b; }

        .card { background: white; border-radius: 25px; padding: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; margin-bottom: 15px; }
        
        /* شريط الأدوات الذكي (تكبير/تصغير/إملاء) */
        .toolbar { display: flex; gap: 8px; margin-bottom: 10px; justify-content: center; align-items: center; }
        .t-btn { background: #f1f5f9; border: none; padding: 8px 12px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
        .t-btn:active { background: #e2e8f0; scale: 0.95; }
        .btn-mic { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }

        textarea { width: 100%; height: 250px; border: 2px solid #f1f5f9; border-radius: 15px; padding: 15px; font-size: 16px; box-sizing: border-box; outline: none; resize: none; line-height: 1.6; transition: border 0.3s; }
        textarea:focus { border-color: var(--primary); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
        button.action { padding: 14px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .btn-p { background: var(--primary); color: white; }
        .btn-s { background: #f1f5f9; color: #1e293b; }

        /* شريط الحالة المطور */
        #status { font-size: 0.85rem; text-align: center; font-weight: bold; margin-bottom: 10px; padding: 10px; border-radius: 12px; display: none; animation: slideIn 0.3s; }
        .st-info { display: block !important; background: #e0f2fe; color: #0369a1; }
        .st-success { display: block !important; background: #dcfce7; color: #15803d; }

        /* الملاحة السفلى */
        .nav { position: fixed; bottom: 10px; left: 10px; right: 10px; background: white; display: flex; padding: 8px; border-radius: 20px; box-shadow: 0 5px 25px rgba(0,0,0,0.15); z-index: 1000; }
        .nav-btn { flex: 1; border: none; background: none; padding: 12px; font-weight: bold; font-size: 0.85rem; color: #64748b; cursor: pointer; border-radius: 15px; }
        .nav-btn.active { background: var(--primary); color: white; }

        .sec { display: none; }
        .sec.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <div class="brand">
        <h2>Smart Assistant</h2>
        <p>النسخة السريعة الشاملة | م. خولة المحجوبي</p>
    </div>

    <div id="status"></div>

    <div id="main-sec" class="sec active">
        <div class="card">
            <div class="toolbar">
                <button class="t-btn" onclick="zoom('txt', 2)">➕ تكبير</button>
                <button class="t-btn" onclick="zoom('txt', -2)">➖ تصغير</button>
                <button id="micBtn" class="t-btn btn-mic" onclick="startDictation()">🎤 إملاء صوتي</button>
            </div>

            <textarea id="txt" placeholder="اكتبي هنا، أو استخدمي الإملاء الصوتي، أو ارفعي صورة لاستخراج النص.."></textarea>
            
            <div class="grid">
                <button class="action btn-p" onclick="document.getElementById('fileIn').click()">📷 استخراج من صورة</button>
                <button class="action btn-p" onclick="translateTxt()">🌐 ترجمة فورية</button>
                <button class="action btn-s" onclick="speakTxt()">🔊 قراءة النص</button>
                <button class="action btn-s" onclick="printTxt()">📄 طباعة</button>
            </div>
            <input type="file" id="fileIn" hidden accept="image/*" onchange="runOCR(this)">
        </div>
        
        <div class="grid" style="padding: 0 10px;">
            <button class="action btn-s" onclick="copyTxt()">📋 نسخ</button>
            <button class="action btn-s" style="color:red" onclick="clearTxt()">🗑️ مسح</button>
        </div>
    </div>

    <div class="nav">
        <button class="nav-btn active" onclick="tab('main-sec', this)">🏠 الرئيسية</button>
        <button class="nav-btn" onclick="alert('دليل م. خولة: استخدمي أيقونة الكاميرا للصور، والميكروفون للكلام، والترجمة للعربية.')">ℹ️ مساعدة</button>
    </div>
</div>

<script>
    const st = document.getElementById('status');
    const txt = document.getElementById('txt');

    function tab(id, btn) {
        document.querySelectorAll('.sec').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    // 1. استخراج النص من الصورة (أداء محسن)
    async function runOCR(input) {
        if (!input.files[0]) return;
        st.innerText = "⏳ جاري استخراج النص من الصورة...";
        st.className = "st-info";
        
        try {
            const worker = await Tesseract.createWorker('ara+eng');
            const { data: { text } } = await worker.recognize(input.files[0]);
            txt.value = text.trim() || "لم أستطع التعرف على نص واضح.";
            st.innerText = "✅ اكتمل استخراج النص";
            st.className = "st-success";
            await worker.terminate();
        } catch (e) {
            st.innerText = "❌ فشل التعرف على الصورة.";
            st.className = "";
        }
    }

    // 2. التعرف على الصوت (إملاء صوتي)
    function startDictation() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return alert("متصفحك لا يدعم التعرف على الصوت");

        const recognition = new SpeechRecognition();
        recognition.lang = 'ar-SA';
        recognition.onstart = () => {
            st.innerText = "🎤 أنا أسمعكِ الآن.. تحدثي";
            st.className = "st-info";
            document.getElementById('micBtn').innerText = "🛑 توقف";
        };
        recognition.onresult = (event) => {
            txt.value += event.results[0][0].transcript;
            st.innerText = "✅ تم تسجيل صوتك";
            st.className = "st-success";
        };
        recognition.onend = () => {
            document.getElementById('micBtn').innerText = "🎤 إملاء صوتي";
        };
        recognition.start();
    }

    // 3. الترجمة السريعة
    async function translateTxt() {
        if (!txt.value) return;
        st.innerText = "⏳ جاري الترجمة...";
        st.className = "st-info";
        try {
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ar&dt=t&q=${encodeURIComponent(txt.value)}`);
            const data = await res.json();
            txt.value = data[0].map(x => x[0]).join('');
            st.innerText = "✅ تمت الترجمة للعربية";
            st.className = "st-success";
        } catch (e) { st.innerText = "❌ خطأ في الترجمة"; }
    }

    // 4. المساعدة على القراءة وتغيير الخط
    function zoom(id, delta) {
        const el = document.getElementById(id);
        const size = parseFloat(window.getComputedStyle(el).fontSize);
        el.style.fontSize = (size + delta) + 'px';
    }

    function speakTxt() {
        if(!txt.value) return;
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(txt.value);
        m.lang = 'ar-SA';
        window.speechSynthesis.speak(m);
        st.innerText = "🔊 جاري القراءة الصوتية...";
        st.className = "st-info";
    }

    // 5. الطباعة والنسخ
    function printTxt() {
        if(!txt.value) return;
        const win = window.open('', '_blank');
        win.document.write(`<html dir="rtl"><body style="padding:40px; font-family:sans-serif;"><h3>تقرير م. خولة</h3><hr><p style="white-space:pre-wrap; font-size:20px;">${txt.value}</p><script>window.print();<\/script></body></html>`);
        win.document.close();
    }

    function copyTxt() {
        txt.select();
        document.execCommand('copy');
        st.innerText = "📋 تم النسخ بنجاح";
        st.className = "st-success";
    }

    function clearTxt() { if(confirm("هل تريد مسح النص؟")) txt.value = ""; }

    // حفظ تلقائي
    setInterval(() => localStorage.setItem('kh_save', txt.value), 2000);
    window.onload = () => txt.value = localStorage.getItem('kh_save') || "";
</script>

</body>
</html>
