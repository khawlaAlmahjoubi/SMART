<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMART Engineering Assistant | م. خولة</title>
    
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>

    <style>
        :root { 
            --primary: #4f46e5; --secondary: #10b981; --bg: #f8fafc; 
            --card-bg: #ffffff; --text: #1e293b; 
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; transition: 0.3s; }
        .app-container { max-width: 500px; margin: auto; background: var(--card-bg); border-radius: 2rem; padding: 1.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }

        /* التبويبات */
        .tabs { display: flex; justify-content: space-around; margin-bottom: 15px; border-bottom: 2px solid #eee; }
        .tab-btn { padding: 10px; cursor: pointer; border: none; background: none; color: var(--text); font-weight: bold; opacity: 0.6; }
        .tab-btn.active { opacity: 1; border-bottom: 3px solid var(--primary); color: var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* الأزرار */
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        button { padding: 10px; border-radius: 12px; border: 1px solid #ddd; background: #f9f9f9; color: #333; cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 5px; transition: 0.2s;}
        button:active { transform: scale(0.95); }
        .btn-main { background: var(--primary); color: white; border: none; }
        .btn-success { background: var(--secondary); color: white; border: none; }
        .btn-danger { background: #fee2e2; color: #dc2626; border: none; }
        
        /* صندوق النص المعدل - قابل للتعديل */
        textarea { 
            width: 100%; 
            height: 250px; /* زيادة الطول لسهولة التعديل */
            border-radius: 15px; 
            border: 2px solid #4f46e5; 
            padding: 15px; 
            font-size: 16px; 
            resize: vertical; 
            box-sizing: border-box; 
            line-height: 1.6; 
            background: #fff;
            color: #333;
        }
        
        .status { font-size: 0.85rem; color: var(--primary); margin: 10px 0; text-align: center; font-weight: bold; min-height: 1.2em; }
        
        /* إعدادات الطباعة لضمان ظهور النص المعدل */
        @media print {
            body * { visibility: hidden; }
            #printArea { 
                visibility: visible; 
                position: absolute; 
                left: 0; top: 0; width: 100%; 
                padding: 30px; 
                direction: rtl; 
                white-space: pre-wrap; 
                font-size: 18pt;
                line-height: 1.8;
                display: block !important; 
            }
        }
        #printArea { display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <h3 style="text-align:center; color:var(--primary)">المساعد الهندسي SMART</h3>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('main')">الرئيسية</button>
        <button class="tab-btn" onclick="openTab('adv')">متقدم (معالجة الصور)</button>
    </div>

    <div id="status" class="status">جاهز للعمل..</div>

    <div id="main" class="tab-content active">
        <textarea id="txtMain" placeholder="اكتب ملاحظاتك السريعة هنا..."></textarea>
        <div class="grid-menu" style="margin-top:10px;">
            <button class="btn-main" onclick="copyToClipboard('txtMain')">📋 نسخ</button>
            <button class="btn-danger" onclick="clearText('txtMain')">🗑️ مسح</button>
        </div>
    </div>

    <div id="adv" class="tab-content">
        <div class="grid-menu">
            <button class="btn-main" onclick="document.getElementById('imgInput').click()" style="grid-column: span 2; padding: 15px; font-size: 1.1rem;">📷 اختر صورة لاستخراج النص</button>
        </div>
        
        <input type="file" id="imgInput" hidden accept="image/*" onchange="extractText(this)">
        
        <label style="font-size: 0.9rem; font-weight: bold; color: var(--primary);">📝 المعاينة والتعديل قبل الطباعة:</label>
        <textarea id="txtAdv" placeholder="سيظهر النص هنا.. يمكنك حذفه، تعديله، أو الإضافة عليه بحرية قبل الطباعة."></textarea>
        
        <div class="grid-menu" style="margin-top:15px;">
            <button class="btn-success" onclick="cleanExtractedText()">🧹 تنظيف ذكي</button>
            <button onclick="copyToClipboard('txtAdv')">📋 نسخ النص</button>
            <button class="btn-main" onclick="printText('txtAdv')" style="grid-column: span 2; background: #000; color: #fff;">📄 حفظ كـ PDF (النص المعدل)</button>
            <button class="btn-danger" onclick="clearText('txtAdv')" style="grid-column: span 2;">🗑️ إفراغ المربع</button>
        </div>
    </div>

    <div style="text-align:center; margin-top:20px; font-size:0.8rem; opacity:0.7">
        إعداد المهندسة خولة المحجوبي ©
    </div>
</div>

<div id="printArea"></div>

<script>
    function openTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabName).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function setStatus(msg) { document.getElementById('status').innerText = msg; }

    // وظيفة استخراج النص
    function extractText(input) {
        if(!input.files[0]) return;
        setStatus("⏳ جاري قراءة الصورة بدقة...");
        Tesseract.recognize(input.files[0], 'ara+eng').then(({ data: { text } }) => {
            document.getElementById('txtAdv').value = text;
            setStatus("✅ تم الاستخراج. يمكنك التعديل على النص الآن.");
        }).catch(err => {
            setStatus("❌ خطأ في القراءة");
        });
    }

    // تنظيف النص مع الحفاظ على ما عدلته المهندسة
    function cleanExtractedText() {
        let area = document.getElementById('txtAdv');
        if(!area.value) return;
        area.value = area.value
            .replace(/[`~|\\_]/g, '') 
            .replace(/\n\s*\n/g, '\n')
            .trim();
        setStatus("🧹 تم التنظيف التلقائي");
    }

    function copyToClipboard(areaId) {
        let text = document.getElementById(areaId).value;
        navigator.clipboard.writeText(text);
        setStatus("✅ تم النسخ");
    }

    // طباعة النص الظاهر حالياً (بما في ذلك التعديلات اليدوية)
    function printText(areaId) {
        let text = document.getElementById(areaId).value;
        if(!text) { setStatus("⚠️ لا يوجد نص للطباعة"); return; }
        document.getElementById('printArea').innerText = text;
        window.print();
    }

    function clearText(areaId) {
        if(confirm("سيتم مسح النص تماماً، هل أنتِ متأكدة؟")) {
            document.getElementById(areaId).value = "";
            setStatus("🗑️ تم المسح");
        }
    }
</script>
</body>
</html>
