<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/jpeg" href="icon1999.jpeg">
    <link rel="apple-touch-icon" href="icon1999.jpeg">
    <title>Smart Engine Turbo | م. خولة</title>
    
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>

    <style>
        :root { --p: #2563eb; --bg: #f8fafc; --acc: #059669; --err: #dc2626; }
        body { font-family: system-ui, sans-serif; background: var(--bg); margin: 0; padding: 10px; overflow-x: hidden; }
        .card { max-width: 500px; margin: auto; background: white; border-radius: 25px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        
        .brand { text-align: center; margin-bottom: 15px; }
        .brand img { width: 70px; height: 70px; border-radius: 20px; border: 3px solid var(--p); object-fit: cover; }
        .brand h2 { color: var(--p); margin: 5px 0 0; font-size: 1.4rem; }

        #status { font-size: 0.9rem; text-align: center; padding: 12px; margin-bottom: 12px; border-radius: 12px; display: none; font-weight: bold; border: 1px solid transparent; }
        .st-work { display: block; background: #eff6ff; color: #1e40af; border-color: #bfdbfe; }
        .st-done { display: block; background: #dcfce7; color: #15803d; border-color: #bbf7d0; }
        .st-jump { display: block; background: #fff7ed; color: #9a3412; border-color: #fed7aa; }

        textarea { width: 100%; height: 380px; border: 2px solid #e2e8f0; border-radius: 20px; padding: 15px; font-size: 18px; line-height: 1.6; outline: none; box-sizing: border-box; resize: none; background: #fff; transition: 0.3s; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn { padding: 16px; border: none; border-radius: 15px; font-weight: 800; cursor: pointer; color: white; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .bg-blue { background: var(--p); box-shadow: 0 4px 10px rgba(37,99,235,0.2); }
        .bg-green { background: var(--acc); }
        .bg-black { background: #1e293b; }
        .btn:active { transform: scale(0.96); }
        
        .toolbar { display: flex; gap: 8px; margin-bottom: 12px; justify-content: center; flex-wrap: wrap; }
        .t-btn { background: #f1f5f9; border: none; padding: 10px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.85rem; color: #475569; }
        .mic-active { background: var(--err) !important; color: white !important; animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.7; } }
    </style>
</head>
<body>

<div class="card">
    <div class="brand">
        <img src="icon1999.jpeg" alt="Logo" onerror="this.style.display='none'">
        <h2>Smart Engine Turbo</h2>
        <small style="color:#64748b; font-weight:bold;">نسخة المهندسة خولة - أداء عالي</small>
    </div>

    <div id="status"></div>

    <div class="toolbar">
        <button class="t-btn" onclick="zoom(2)">➕</button>
        <button class="t-btn" onclick="zoom(-2)">➖</button>
        <button id="micBtn" class="t-btn" onclick="toggleSpeech()">🎤 إملاء</button>
        <button class="t-btn" style="color:var(--acc)" onclick="cleanText()">✨ تنظيف</button>
    </div>

    <textarea id="box" placeholder="اكتبي، تكلمي، أو ارفعي صورة..."></textarea>

    <div class="btn-grid">
        <button class="btn bg-blue" onclick="document.getElementById('fileIn').click()">📷 استخراج سريع</button>
        <button class="btn bg-blue" onclick="hybridTranslate()">🌐 ترجمة ذكية</button>
        <button class="btn bg-green" onclick="speak()">🔊 قراءة</button>
        <button class="btn bg-black" onclick="copy()">📋 نسخ</button>
        <button class="btn bg-black" onclick="printDoc()">📄 طباعة</button>
        <button class="btn bg-black" style="color:#ff8080" onclick="cls()">🗑️ مسح</button>
    </div>
    
    <input type="file" id="fileIn" hidden accept="image/*" onchange="runFastOCR(this)">
</div>

<script>
    const box = document.getElementById('box');
    const st = document.getElementById('status');

    function notify(msg, type='work') {
        st.innerText = msg;
        st.className = 'st-' + type;
        st.style.display = 'block';
        if(type === 'done') setTimeout(() => st.style.display = 'none', 3000);
    }

    // --- محرك الاستخراج التوربيني ---
    async function runFastOCR(input) {
        if (!input.files[0]) return;
        notify("🚀 جاري المعالجة التوربينية... ثواني فقط");
        box.value = "جاري استخراج النص بأقصى سرعة...";

        try {
            // المعالجة المسبقة: استخدام محرك Tesseract مع إعدادات السرعة
            const { data: { text } } = await Tesseract.recognize(
                input.files[0],
                'ara+eng',
                { logger: m => { if(m.status === 'recognizing text') notify(`🚀 جاري التحليل: ${Math.round(m.progress * 100)}%`); } }
            );

            box.value = text.trim() || "لم يتم العثور على نص. تأكدي من إضاءة الصورة.";
            notify("✅ تم الاستخراج بنجاح", "done");
        } catch (e) {
            notify("❌ حدث خطأ.. حاولي مرة أخرى", "work");
            box.value = "";
        }
    }

    // --- الترجمة الهجينة ---
    async function hybridTranslate() {
        const txt = box.value.trim();
        if (!txt) return;
        const isAr = /[\u0600-\u06FF]/.test(txt);
        const target = isAr ? 'en' : 'ar';

        if (txt.length > 1000) {
            notify("🚀 النص طويل جداً.. جاري النقل لجوجل", "st-jump");
            setTimeout(() => window.open(`https://translate.google.com/?sl=auto&tl=${target}&text=${encodeURIComponent(txt)}`, '_blank'), 500);
            return;
        }

        notify("⏳ جاري الترجمة...");
        try {
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${target}&dt=t&q=${encodeURIComponent(txt)}`);
            const data = await res.json();
            let out = ""; data[0].forEach(p => { if (p[0]) out += p[0]; });
            box.value = out;
            box.style.textAlign = target === 'en' ? 'left' : 'right';
            notify("✅ تمت الترجمة", "done");
        } catch (e) {
            window.open(`https://translate.google.com/?sl=auto&tl=${target}&text=${encodeURIComponent(txt)}`, '_blank');
        }
    }

    // --- بقية الوظائف ---
    let rec;
    function toggleSpeech() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) return alert("غير مدعوم");
        if (!rec) {
            rec = new SR(); rec.lang = 'ar-SA'; rec.continuous = true;
            rec.onstart = () => { document.getElementById('micBtn').classList.add('mic-active'); notify("🎤 أسمعكِ الآن...", "work"); };
            rec.onresult = (e) => { box.value += " " + e.results[e.results.length - 1][0].transcript; };
            rec.onend = () => { document.getElementById('micBtn').classList.remove('mic-active'); rec = null; };
            rec.start();
        } else { rec.stop(); }
    }

    function cleanText() {
        box.value = box.value.replace(/[^\S\r\n]{2,}/g, ' ').replace(/\n\s*\n/g, '\n').trim();
        notify("✨ تم التنظيف", "done");
    }
    function zoom(n) { let s = parseFloat(window.getComputedStyle(box).fontSize); box.style.fontSize = (s + n) + 'px'; }
    function copy() { box.select(); document.execCommand('copy'); notify("📋 تم النسخ", "done"); }
    function speak() { 
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(box.value);
        m.lang = box.style.textAlign === 'left' ? 'en-US' : 'ar-SA';
        window.speechSynthesis.speak(m);
    }
    function printDoc() {
        const w = window.open();
        w.document.write(`<body dir="${box.style.textAlign==='left'?'ltr':'rtl'}" style="padding:30px;">${box.value}</body>`);
        w.print();
    }
    function cls() { if(confirm("مسح؟")) box.value = ""; }

    setInterval(() => localStorage.setItem('kh_turbo_db', box.value), 2000);
    window.onload = () => box.value = localStorage.getItem('kh_turbo_db') || "";
</script>

</body>
</html>
