<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMART Engineering Assistant | م. خولة</title>
    
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>

    <style>
        :root { 
            --primary: #4f46e5; --secondary: #10b981; --bg: #f8fafc; 
            --card-bg: #ffffff; --text: #1e293b; 
        }
        .dark-mode { --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; transition: 0.3s; }
        .app-container { max-width: 500px; margin: auto; background: var(--card-bg); border-radius: 2rem; padding: 1.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }

        /* التبويبات */
        .tabs { display: flex; justify-content: space-around; margin-bottom: 15px; border-bottom: 2px solid #eee; }
        .tab-btn { padding: 10px; cursor: pointer; border: none; background: none; color: var(--text); font-weight: bold; opacity: 0.6; }
        .tab-btn.active { opacity: 1; border-bottom: 3px solid var(--primary); color: var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* الأزرار والقوائم */
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        button { padding: 10px; border-radius: 12px; border: 1px solid #ddd; background: #f9f9f9; color: #333; cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 5px; transition: 0.2s;}
        button:active { transform: scale(0.95); }
        .btn-main { background: var(--primary); color: white; border: none; }
        .btn-danger { background: #fee2e2; color: #dc2626; border: none; }
        .btn-blue { background: #dbeafe; color: #1d4ed8; border: none; }
        
        /* أزرار التحكم بالخط */
        .font-controls { display: flex; justify-content: space-between; margin-bottom: 10px; gap: 10px; }
        .font-controls button { flex: 1; padding: 8px; background: #e2e8f0; border: none; border-radius: 8px; font-weight: bold;}

        textarea { width: 100%; height: 180px; border-radius: 15px; border: 2px solid #eee; padding: 15px; font-size: 16px; resize: none; box-sizing: border-box; line-height: 1.6; transition: 0.3s;}
        
        /* الأدوات الهندسية وتصميم الآلة الحاسبة */
        .tool-box { background: var(--bg); padding: 15px; border-radius: 15px; margin-top: 10px; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 1rem;}
        
        .calc-display { width: 100%; padding: 15px; font-size: 1.5rem; text-align: left; background: #e2e8f0; border: none; border-radius: 10px; margin-bottom: 10px; color: #333; outline: none; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .calc-btn { padding: 15px; font-size: 1.2rem; border-radius: 10px; background: #fff; border: 1px solid #ddd; font-weight: bold; }
        .calc-btn.op { background: var(--primary); color: white; border: none; }
        .calc-btn.eq { background: var(--secondary); color: white; border: none; }
        .calc-btn.clear { background: #ef4444; color: white; border: none; }

        .status { font-size: 0.85rem; color: var(--primary); margin: 10px 0; height: 15px; text-align: center; font-weight: bold;}
        
        @media print {
            body * { visibility: hidden; }
            #txtInput { visibility: visible; position: absolute; left: 0; top: 0; width: 100%; height: auto; border: none; font-size: 16pt; padding: 20px;}
        }
    </style>
</head>
<body>

<div class="app-container">
    <h3 style="text-align:center; color:var(--primary)">المساعد الهندسي SMART</h3>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('main')">الرئيسية</button>
        <button class="tab-btn" onclick="openTab('eng')">هندسي</button>
        <button class="tab-btn" onclick="openTab('adv')">متقدم</button>
    </div>

    <div id="status" class="status">جاهز للعمل..</div>

    <div id="main" class="tab-content active">
        <div class="grid-menu">
            <button class="btn-main" onclick="handleSpeak()">🔊 قراءة</button>
            <button class="btn-danger" onclick="handleStop()">⏹️ إيقاف</button>
            <button class="btn-main" onclick="handleDictation()">🎤 إملاء</button>
            <button onclick="handleTranslate()">🌐 ترجمة (EN)</button>
        </div>
        
        <div class="font-controls">
            <button onclick="changeFontSize(2)">A+ تكبير الخط</button>
            <button onclick="changeFontSize(-2)">A- تصغير الخط</button>
        </div>
        <textarea id="txtInput" placeholder="اكتب هنا أو استخدم الأدوات (الصوت، الصور)..."></textarea>
    </div>

    <div id="eng" class="tab-content">
        <div class="tool-box">
            <label>🔢 آلة حاسبة:</label>
            <input type="text" id="calcDisplay" class="calc-display" readonly placeholder="0">
            <div class="calc-grid">
                <button class="calc-btn clear" onclick="calcAction('C')">C</button>
                <button class="calc-btn op" onclick="calcAction('(')">(</button>
                <button class="calc-btn op" onclick="calcAction(')')">)</button>
                <button class="calc-btn op" onclick="calcAction('/')">÷</button>
                
                <button class="calc-btn" onclick="calcAction('7')">7</button>
                <button class="calc-btn" onclick="calcAction('8')">8</button>
                <button class="calc-btn" onclick="calcAction('9')">9</button>
                <button class="calc-btn op" onclick="calcAction('*')">×</button>
                
                <button class="calc-btn" onclick="calcAction('4')">4</button>
                <button class="calc-btn" onclick="calcAction('5')">5</button>
                <button class="calc-btn" onclick="calcAction('6')">6</button>
                <button class="calc-btn op" onclick="calcAction('-')">-</button>
                
                <button class="calc-btn" onclick="calcAction('1')">1</button>
                <button class="calc-btn" onclick="calcAction('2')">2</button>
                <button class="calc-btn" onclick="calcAction('3')">3</button>
                <button class="calc-btn op" onclick="calcAction('+')">+</button>
                
                <button class="calc-btn" onclick="calcAction('0')">0</button>
                <button class="calc-btn" onclick="calcAction('.')">.</button>
                <button class="calc-btn eq" onclick="calcAction('=')" style="grid-column: span 2;">=</button>
            </div>
        </div>

        <div class="tool-box">
            <label>📏 محول الوحدات الشامل:</label>
            <input type="number" id="unitVal" value="1" oninput="convertUnits()">
            <select id="unitType" onchange="convertUnits()">
                <optgroup label="الطول (Length)">
                    <option value="m-cm">متر إلى سنتيمتر</option>
                    <option value="cm-m">سنتيمتر إلى متر</option>
                    <option value="km-m">كيلومتر إلى متر</option>
                    <option value="in-cm">بوصة (Inch) إلى سنتيمتر</option>
                    <option value="ft-m">قدم (Foot) إلى متر</option>
                </optgroup>
                <optgroup label="الوزن (Weight)">
                    <option value="kg-g">كيلوجرام إلى جرام</option>
                    <option value="kg-lb">كيلوجرام إلى باوند (lb)</option>
                    <option value="lb-kg">باوند (lb) إلى كيلوجرام</option>
                </optgroup>
                <optgroup label="الحرارة (Temperature)">
                    <option value="c-f">مئوي (C) إلى فهرنهايت (F)</option>
                    <option value="f-c">فهرنهايت (F) إلى مئوي (C)</option>
                </optgroup>
            </select>
            <div id="unitResult" style="font-weight:bold; color:var(--primary); margin-top:10px;">النتيجة: 100 سم</div>
        </div>
    </div>

    <div id="adv" class="tab-content">
        <div class="grid-menu">
            <button onclick="document.getElementById('imgInput').click()">📷 نص من صورة</button>
            <button class="btn-main" onclick="previewAndPrintPDF()">📄 حفظ كـ PDF</button>
            <button class="btn-blue" onclick="getLocation()">📍 موقعي (GPS)</button>
            <button onclick="addTimestamp()">⏱️ الوقت والتاريخ</button>
            <button onclick="handleCopy()">📋 نسخ النص</button>
            <button onclick="handleClear()" class="btn-danger">🗑️ مسح الكل</button>
        </div>
        <input type="file" id="imgInput" hidden accept="image/*" onchange="extractText(this)">
    </div>

    <div style="text-align:center; margin-top:20px; font-size:0.8rem; opacity:0.7">
        إعداد المهندسة خولة المحجوبي &copy;
    </div>
</div>

<script>
    // نظام التبويبات
    function openTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabName).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    const txtInput = document.getElementById('txtInput');
    const status = document.getElementById('status');
    let currentFontSize = 16; 

    function setStatus(msg) { status.innerText = msg; }

    // تكبير وتصغير الخط
    function changeFontSize(step) {
        currentFontSize += step;
        if(currentFontSize < 12) currentFontSize = 12; 
        if(currentFontSize > 36) currentFontSize = 36; 
        txtInput.style.fontSize = currentFontSize + 'px';
        setStatus(`حجم الخط الآن: ${currentFontSize}`);
    }

    // القراءة والايقاف
    const synth = window.speechSynthesis;
    function handleSpeak() {
        if (!txtInput.value.trim()) { setStatus("⚠️ النص فارغ!"); return; }
        synth.cancel();
        const speech = new SpeechSynthesisUtterance(txtInput.value);
        speech.lang = 'ar-SA';
        synth.speak(speech);
        setStatus("🔊 جاري القراءة...");
    }

    function handleStop() { synth.cancel(); setStatus("⏹️ تم إيقاف القراءة"); }

    // الإملاء
    function handleDictation() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SpeechRecognition){ setStatus("❌ متصفحك لا يدعم الإملاء"); return; }
        const recognition = new SpeechRecognition();
        recognition.lang = 'ar-SA';
        recognition.onstart = () => setStatus("🎤 اسمعك... تحدث الآن");
        recognition.onresult = (e) => { 
            txtInput.value += (txtInput.value ? " " : "") + e.results[0][0].transcript; 
            setStatus("✅ تم الإملاء"); 
        };
        recognition.start();
    }

    // الترجمة
    async function handleTranslate() {
        if (!txtInput.value.trim()) return;
        setStatus("⏳ جاري الترجمة...");
        try {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ar&tl=en&dt=t&q=${encodeURIComponent(txtInput.value)}`;
            const res = await fetch(url);
            const data = await res.json();
            let translatedText = '';
            data[0].forEach(item => { translatedText += item[0]; });
            txtInput.value = translatedText;
            setStatus("✅ تمت الترجمة بنجاح");
        } catch(e) { setStatus("❌ خطأ في الترجمة"); }
    }

    function handleCopy() {
        navigator.clipboard.writeText(txtInput.value);
        setStatus("✅ تم نسخ النص");
    }

    // الآلة الحاسبة
    const calcDisplay = document.getElementById('calcDisplay');
    function calcAction(val) {
        if (val === 'C') {
            calcDisplay.value = '';
        } else if (val === '=') {
            try {
                let equation = calcDisplay.value.replace(/×/g, '*').replace(/÷/g, '/');
                calcDisplay.value = eval(equation) || '';
            } catch {
                calcDisplay.value = 'خطأ';
                setTimeout(() => calcDisplay.value = '', 1500);
            }
        } else {
            if(calcDisplay.value === 'خطأ') calcDisplay.value = '';
            calcDisplay.value += val;
        }
    }

    // محول الوحدات
    function convertUnits() {
        const val = parseFloat(document.getElementById('unitVal').value) || 0;
        const type = document.getElementById('unitType').value;
        let res = "";
        
        if(type === "m-cm") res = (val * 100) + " سم";
        if(type === "cm-m") res = (val / 100) + " متر";
        if(type === "km-m") res = (val * 1000) + " متر";
        if(type === "in-cm") res = (val * 2.54).toFixed(2) + " سم";
        if(type === "ft-m") res = (val * 0.3048).toFixed(2) + " متر";
        
        if(type === "kg-g") res = (val * 1000) + " جرام";
        if(type === "kg-lb") res = (val * 2.20462).toFixed(2) + " باوند (lb)";
        if(type === "lb-kg") res = (val / 2.20462).toFixed(2) + " كجم";
        
        if(type === "c-f") res = ((val * 9/5) + 32).toFixed(2) + " فهرنهايت (°F)";
        if(type === "f-c") res = ((val - 32) * 5/9).toFixed(2) + " مئوي (°C)";

        document.getElementById('unitResult').innerText = "النتيجة: " + res;
    }

    // --- الوظائف المتقدمة ---
    
    // 1. استخراج النص من الصورة
    function extractText(input) {
        if(!input.files[0]) return;
        setStatus("⏳ جاري تحليل الصورة... يرجى الانتظار");
        Tesseract.recognize(input.files[0], 'ara+eng').then(({ data: { text } }) => {
            txtInput.value += "\n\n" + text.trim() + "\n";
            setStatus("✅ تم استخراج النص بنجاح");
        }).catch(err => setStatus("❌ فشل في قراءة الصورة"));
    }

    // 2. معاينة وحفظ PDF
    function previewAndPrintPDF() {
        if (!txtInput.value.trim()) { setStatus("⚠️ لا يوجد نص لحفظه!"); return; }
        setStatus("📄 جاري فتح المعاينة...");
        window.print();
        setStatus("✅ تمت المعاينة");
    }

    // 3. جلب الموقع (مصحح)
    function getLocation() {
        if (navigator.geolocation) {
            setStatus("📍 جاري تحديد إحداثيات الموقع...");
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude.toFixed(6);
                    const lon = position.coords.longitude.toFixed(6);
                    const mapsLink = `https://maps.google.com/?q=${lat},${lon}`;
                    
                    txtInput.value += `\n\n📍 إحداثيات الموقع الميداني:\n- خط العرض: ${lat}\n- خط الطول: ${lon}\n- الرابط: ${mapsLink}\n`;
                    setStatus("✅ تم إدراج الموقع الجغرافي");
                },
                (error) => {
                    setStatus("❌ يرجى تفعيل الـ GPS والسماح للمتصفح بمعرفة موقعك");
                }
            );
        } else {
            setStatus("❌ متصفحك لا يدعم تحديد الموقع");
        }
    }

    // 4. الوقت والتاريخ
    function addTimestamp() {
        const now = new Date();
        const timeString = now.toLocaleString('ar-EG');
        txtInput.value += `\n⏱️ [${timeString}]:\n`;
        setStatus("✅ تمت إضافة الوقت والتاريخ");
        txtInput.focus();
    }

    function handleClear() {
        if(confirm("هل أنت متأكد أنك تريد مسح كل النص؟")) txtInput.value = "";
    }
</script>
</body>
</html>
